<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ivory — bu şarkı kimin listesinden?</title>
    <meta name="description" content="Arkadaşlarınla oynanan müzik tahmin oyunu: Spotify geçmişinizden rastgele şarkılar çalar, kimin dinlediğini tahmin edersiniz." />
    <meta name="theme-color" content="#08080d" />
    <meta property="og:title" content="Ivory — bu şarkı kimin listesinden?" />
    <meta property="og:description" content="Şarkı çalar, kimin dinlediğini tahmin edersin. Doğru +3, yanlış −1." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308080d'/%3E%3Crect x='5' y='14' width='3.4' height='10' rx='1.7' fill='%23ff5d73'/%3E%3Crect x='10' y='9' width='3.4' height='15' rx='1.7' fill='%23ffd84d'/%3E%3Crect x='15' y='5' width='3.4' height='19' rx='1.7' fill='%235ee6a0'/%3E%3Crect x='20' y='11' width='3.4' height='13' rx='1.7' fill='%234cc9f0'/%3E%3Crect x='25' y='16' width='3.4' height='8' rx='1.7' fill='%23c77dff'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="app"></div>
    <noscript><p style="padding: 24px; color: #fff">Bu oyun için JavaScript gerekli.</p></noscript>
    <script>
      window.IVORY_FILES = ['app', 'audio', 'client', 'demo', 'host', 'lib', 'lyrics', 'mqtt', 'net', 'spotify', 'util'].map((f) => 'js/' + f + '.js');
      // Dosyalar birbirini tutmazsa (yarım güncelleme) sayfa boş kalır ya da oyun ortasında
      // hata verir. Bu olursa dosyaları tazeleyip bir kez yeniler.
      window.addEventListener('error', async (e) => {
        if (!/requested module|export named|Importing binding|is not a function|is not defined/i.test(e.message || '')) return;
        const last = Number(sessionStorage.getItem('ivory.healed')) || 0;
        if (Date.now() - last < 600000) return;
        sessionStorage.setItem('ivory.healed', String(Date.now()));
        await Promise.all([...window.IVORY_FILES, 'config.js', 'css/style.css'].map((f) => fetch(f, { cache: 'reload' }).catch(() => {})));
        location.reload();
      });
    </script>
    <script src="config.js"></script>
    <script type="module">
      // Tarayıcı dosyaları ayrı ayrı sakladığı için yeni sürümden sonra bir kısmı eski kalabiliyor.
      // Uygulama başlamadan önce hepsinin güncel olup olmadığı sunucuya sorulur; böylece dosyalar
      // hep aynı sürümden yüklenir.
      await Promise.all(window.IVORY_FILES.map((f) => fetch(f, { cache: 'no-cache' }).catch(() => {})));
      import('./js/app.js');
    </script>
  </body>
</html>
